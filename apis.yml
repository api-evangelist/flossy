  detail: >-
    Flossy ships AI agents only as an end-user product for practices — there is no
    developer portal, API reference or spec anywhere on its surface: /developers,
    /developer, /api and /docs all 404, developer.flossy.com and docs.flossy.com do
    not resolve, api.flossy.com is a dangling CNAME to a Heroku Private Space with no
    public A record, and the one live API host (scheduler-api.flossy.com) answers 200
    on its root but 404s every OpenAPI/Swagger/docs path and requires an x-api-key.
