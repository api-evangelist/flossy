aid: flossy
name: Flossy
description: 'Flossy is a Santa Monica, California healthcare technology company that
  builds AI agents ("AI coworkers") for dental practices, veterinary clinics and med
  spas. Its named agents cover front-office and revenue-cycle work: Fiona handles inbound
  and outbound patient communication and scheduling across phone, SMS and web chat;
  Betsy scores call-center quality and marketing performance; Michael captures insurance,
  verifies benefits and surfaces billing insights; and Reid forecasts revenue and optimizes
  schedule capacity and staffing. FlossyHQ is the operator console the practice works
  in, and Agent Builder lets practices assemble custom agents. Founded in 2020 by Miles
  Beckett and Steve Seigel, Flossy began as a pay-as-you-go dental care marketplace
  and has since repositioned around agentic automation for practice operations. Flossy
  publishes no public developer program, API reference or machine-readable specification;
  the one publicly reachable first-party integration surface is the embeddable Fiona
  web-chat widget.'
